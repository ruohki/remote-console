name: Release image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: build & push ghcr.io/ruohki/remote-console
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remote-console
        uses: actions/checkout@v4
        with:
          path: remote-console
      - name: Checkout remote-agent (protocol crate)
        uses: actions/checkout@v4
        with:
          repository: ruohki/remote-agent
          path: remote-agent
          token: ${{ secrets.AGENT_REPO_TOKEN || github.token }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ruohki/remote-console
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: remote-console/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

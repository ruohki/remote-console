# coturn configuration for remote-console.
# Credentials are short-lived HMAC credentials minted by the console (static-auth-secret,
# realm, external-ip and server-name are passed on the command line from docker-compose.yml).

# Plain TURN/STUN (UDP + TCP)
listening-port=3478
# TURN over TLS on 443: the port that gets through corporate firewalls and browsers with
# "disable non-proxied UDP". Needs the certificate below.
tls-listening-port=443
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"

# Relay port range (open it on the firewall for UDP)
min-port=49160
max-port=49200

use-auth-secret
fingerprint
no-cli
no-multicast-peers
stale-nonce=600

# Abuse limits: per-user (= per session) and total relay sessions, and bandwidth caps.
user-quota=8
total-quota=400
max-bps=8000000
bps-capacity=0

# Only allow relaying to public addresses (agents and browsers), never into the host network.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# Never let the relay reach the TURN host's own management ports either.
no-loopback-peers

# Do not answer STUN/TURN for other realms or with software version banners.
no-software-attribute
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

log-file=stdout
# `verbose` logs every allocation; keep it off in production unless debugging.

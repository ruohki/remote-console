# remote-console + coturn. Copy .env.example to .env and adjust before `docker compose up -d`.
services:
  console:
    image: ghcr.io/ruohki/remote-console:latest
    build:
      context: ..
      dockerfile: remote-console/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DATABASE_URL: "sqlite:///data/console.db?mode=rwc"
      LISTEN_ADDR: "0.0.0.0:8080"
      TURN_URLS: "${TURN_URLS:-turn:${TURN_PUBLIC_IP}:3478?transport=udp,turn:${TURN_PUBLIC_IP}:3478?transport=tcp}"
      TURN_SECRET: "${TURN_SECRET}"
    volumes:
      - ./data:/data
    depends_on:
      - coturn

  coturn:
    image: coturn/coturn:4
    restart: unless-stopped
    # host networking keeps the relay port range simple and avoids NAT inside Docker
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--static-auth-secret=${TURN_SECRET}"
      - "--realm=${TURN_REALM:-remote}"
      - "--external-ip=${TURN_PUBLIC_IP}"

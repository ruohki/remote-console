[package]
name = "remote-console"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Management console for remote-agent: device registry, enrollment, WebRTC signaling hub and embedded web UI"

[[bin]]
name = "remote-console"
path = "src/main.rs"

[lib]
name = "remote_console"
path = "src/lib.rs"

[dependencies]
# Shared wire protocol. Local dev: sibling checkout. CI clones remote-agent next to this repo.
protocol = { path = "../../remote-agent/crates/protocol" }



axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "set-header"] }
hyper = "1"
tokio = { version = "1.53", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "macros", "migrate", "chrono", "uuid", "json"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.26", features = ["v4", "v5", "serde"] }

argon2 = "0.6"
rand = "0.10"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
time = "0.3"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["std"] }
subtle = "2.6"
chacha20poly1305 = "0.10"
hkdf = "0.12"
x509-parser = "0.16"
zeroize = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.6", features = ["derive", "env"] }
dotenvy = "0.15"
mime_guess = "2.0"
rust-embed = { version = "8.12", features = ["include-exclude"] }
dashmap = "6.1"
parking_lot = "0.12"
url = "2.5"
ipnet = "2.11"
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "form"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
icns = "0.4"
png = "0.18"
tempfile = "3.24"

# authentication: TOTP, passkeys / security keys, OIDC, SAML, LDAP
totp-rs = { version = "6", features = ["otpauth"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
xml-sec = { version = "0.1", default-features = false, features = ["xmldsig", "c14n", "xml-backend-roxmltree"] }
roxmltree = "0.21"
rsa = { version = "0.9", features = ["sha2", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
flate2 = "1"
glob-match = "0.2"
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"

# outgoing email (password reset, email codes, test messages)
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "builder", "hostname", "pool"] }

[dev-dependencies]
tempfile = "3.24"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "cookies"] }
tokio-tungstenite = "0.30"
webauthn-authenticator-rs = { version = "0.5", default-features = false, features = ["softpasskey"] }
urlencoding = "2"
